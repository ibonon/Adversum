# ==============================================================================
# Adversum Institutional Production Stack — Docker Compose
# ==============================================================================
version: "3.8"

services:
  # ── 1. Redis Event Bus & Pub/Sub Broker ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adversum-redis
    restart: unless-stopped
    # Port intentionally NOT exposed to host — internal network only
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adversum-net

  # ── 2. Local EVM Node (Anvil Fork Engine) ───────────────────────────────────
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: adversum-anvil
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "1"]
    # Port intentionally NOT exposed to host — backend connects via adversum-net
    # ports:
    #   - "8545:8545"
    networks:
      - adversum-net

  # ── 3. FastAPI Security Core & Threat Hunter ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: adversum-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - ANVIL_RPC_URL=http://anvil:8545
      - NEBIUS_MOCK=1
      - API_KEY=adv-dev-key-123
      - DATABASE_URL=sqlite+aiosqlite:///./adversum_prod.db
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      anvil:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - adversum-net

  # ── 4. Nginx Reverse Proxy & Frontend SPA ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: adversum-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - adversum-net

networks:
  adversum-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
