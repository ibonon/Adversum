version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://adversum:adversum_password@db:5432/adversum_db
      - REDIS_URL=redis://redis:6379
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-nvidia/Nemotron-3_5-Lightning}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - API_KEY=${API_KEY:-adv-dev-key-123}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Allow spawning isolated scanner containers

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: adversum
      POSTGRES_PASSWORD: adversum_password
      POSTGRES_DB: adversum_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adversum -d adversum_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: arq orchestrator.workers.llm_worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql+asyncpg://adversum:adversum_password@db:5432/adversum_db
      - REDIS_URL=redis://redis:6379
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-nvidia/Nemotron-3_5-Lightning}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    image: adversum-scanner:latest
    profiles:
      - scanner
    environment:
      - REPO_URL=${REPO_URL:-}
      - OUTPUT_FORMAT=${OUTPUT_FORMAT:-json}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

volumes:
  db_data:
