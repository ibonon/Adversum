version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://adversum:adversum_password@db:5432/adversum_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY:-adv-prod-secret-key-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Allow spawning scanner containers

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: adversum
      POSTGRES_PASSWORD: adversum_password
      POSTGRES_DB: adversum_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adversum -d adversum_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: arq orchestrator.workers.llm_worker.WorkerSettings
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://adversum:adversum_password@db:5432/adversum_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── On-Demand Scanner Image (built but never started as a service) ──────
  # This image is spawned on-demand by the backend via Docker SDK
  # It is NOT auto-started — it's a template for containerized scans
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    image: adversum-scanner:latest  # Named so backend can reference it by name
    profiles:
      - scanner  # Only started if explicitly requested (not part of default `up`)
    environment:
      - REPO_URL=${REPO_URL:-}
      - OUTPUT_FORMAT=${OUTPUT_FORMAT:-json}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:


