name: Adversum CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- RUST CORE ---
  rust-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          core/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}

    - name: Check Formatting
      working-directory: ./core
      run: cargo fmt -- --check

    - name: Clippy (Linting)
      working-directory: ./core
      run: cargo clippy --all-targets --all-features

    - name: Build & Test
      working-directory: ./core
      run: cargo test

  # --- PYTHON BACKEND ---
  python-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        pip install -r requirements.txt --ignore-requires-python || true

    - name: Lint with Ruff (Fatal Syntax & Import Errors)
      run: |
        ruff check --select=E9,F63,F7,F82 .
        ruff check . --ignore=E501 --exit-zero

    - name: Run Complete Test Suite (Phases 1-5 & Core Modules)
      env:
        API_KEY: adv-dev-key-123
        NEBIUS_MOCK: "1"
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests/test_phase*.py orchestrator/tests modules/solidity/tests -v

  # --- FRONTEND ---
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Build
      working-directory: ./frontend
      run: npm run build
