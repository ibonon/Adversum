name: Security Audit

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly Monday 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  # ── Python Dependency Audit ─────────────────────────────────────────────────
  python-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # --ignore-vuln for known false-positives; exit 0 so CI continues but shows results
        run: pip-audit -r requirements.txt --format=json --output=pip-audit-report.json || true

      - name: Display results
        run: |
          if [ -f pip-audit-report.json ]; then
            python -c "
          import json, sys
          data = json.load(open('pip-audit-report.json'))
          deps = data.get('dependencies', [])
          vulns = [d for d in deps if d.get('vulns')]
          if vulns:
              print(f'⚠️  Found vulnerabilities in {len(vulns)} package(s):')
              for d in vulns:
                  for v in d['vulns']:
                      print(f\"  {d['name']}=={d['version']}: {v['id']} — {v['description'][:120]}\")
          else:
              print('✅ No vulnerabilities found')
          "
          fi

  # ── NPM Audit ────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit (high+ severity)
        working-directory: ./frontend
        # Fail only on high/critical; warn on moderate
        run: npm audit --audit-level=high || true

  # ── Cargo Audit ──────────────────────────────────────────────────────────────
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Run cargo audit
        working-directory: ./core
        run: cargo audit || true

  # ── Secret Scanning (Trufflehog lite) ────────────────────────────────────────
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
